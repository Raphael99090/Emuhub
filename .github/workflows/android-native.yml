name: Android nativo (Kotlin + C++)
on:
  push:
    branches: [feature/android-kotlin-native]
    paths:
      - "android-native/**"
      - "hub/native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Instalar ferramentas nativas
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Compilar APK nativo
        run: gradle -p android-native :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: emuhub-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
