name: Android nativo (Kotlin + C++)
on:
  push:
    branches: [main, feature/android-kotlin-native]
    paths:
      - "android-native/**"
      - "hub/native/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Instalar ferramentas nativas
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Compilar APK nativo
        run: gradle -p android-native :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: emuhub-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Versão do app
        if: github.ref == 'refs/heads/main'
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' android-native/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Publicar release da versão (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Emu Hub ${{ steps.ver.outputs.v }}
          files: android-native/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
