name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # O repositório ainda não versiona package-lock.json; usar npm install até gerar lockfile.
      - run: npm install
      - run: python3 hub/build.py
      - run: node scripts/copiar-www.js
      - run: npx cap add android
      - run: node scripts/pos-android.js
      - run: npx --yes @capacitor/assets generate --android --assetPath assets
      - run: npx cap sync android
      # Gradle gera uma debug.keystore local quando não existe uma configurada.
      # Nunca guardar ou publicar chaves de assinatura no repositório.
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: emu-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Emu Hub APK #${{ github.run_number }}
          body: Instale o app-debug.apk no Android (permita fontes desconhecidas). Este APK usa assinatura de depuração gerada no runner.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
