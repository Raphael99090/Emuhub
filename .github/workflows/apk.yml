name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, feature/hybrid-nes-wasm-test]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Configure NES WebAssembly
        run: emcmake cmake -S hub/native -B build/wasm -DCMAKE_BUILD_TYPE=Release
      - name: Build NES WebAssembly
        run: cmake --build build/wasm --target emuhub_core_wasm --parallel 2
      - name: Stage WebAssembly runtime
        run: |
          mkdir -p hub/native/wasm
          cp build/wasm/emuhub-core.js build/wasm/emuhub-core.wasm hub/native/wasm/
      # O repositório ainda não versiona package-lock.json.
      - run: npm install
      - run: python3 hub/build.py
      - name: Testes de regressão dos emuladores
        run: |
          node hub/tests/hub.test.js
          node hub/tests/gba/cpu.test.js
          node hub/tests/gba/system.test.js
          node hub/tests/snes.test.js
          node hub/tests/gb.test.js
          node hub/tests/sms.test.js
          node hub/tests/neogeo.test.js
      - run: node scripts/copiar-www.js
      - run: npx cap add android
      - run: node scripts/pos-android.js
      - run: npx --yes @capacitor/assets generate --android --assetPath assets
      - run: npx cap sync android
      # Configure ANDROID_DEBUG_KEYSTORE_BASE64 nos Secrets para manter a assinatura entre versões.
      - name: Restaurar chave de depuração persistente
        if: env.ANDROID_DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: emu-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar na aba Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Emu Hub APK #${{ github.run_number }}
          body: Instale o app-debug.apk no Android (permita fontes desconhecidas). Configure ANDROID_DEBUG_KEYSTORE_BASE64 nos Secrets para manter a assinatura entre builds.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
