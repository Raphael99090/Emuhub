name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: python3 hub/build.py && rm -rf pwa && cp -r hub/dist/pwa pwa # sempre empacota a versão atual do hub
      - run: node scripts/copiar-www.js
      - run: npx cap add android
      - run: node scripts/pos-android.js
      - name: Gerar ícone Android a partir da nova marca
        run: npx --yes sharp-cli -i assets/emu-hub-icon.svg -o assets/icon.png resize 1024 1024
      - run: npx --yes @capacitor/assets generate --android --assetPath assets
      - run: npx cap sync android
      - run: mkdir -p ~/.android && cp assets/debug.keystore ~/.android/debug.keystore # mesma assinatura em todo build: dá pra atualizar sem desinstalar
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: emu-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Emu Hub v1.0
          body: |
            Emu Hub v1.0 — versão Android de depuração.
            - README atualizado a partir da branch de redesign.
            - Nova identidade visual e ícone Android.
            - Inclui o código atual da branch main.
            - Compatibilidade de jogos ainda em desenvolvimento.
            Baixe app-debug.apk e permita a instalação de aplicativos externos.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
