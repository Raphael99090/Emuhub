name: Gerar APK Android

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar uma Release no GitHub (marque somente quando quiser lançar)"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Tag opcional da Release (ex.: v1.0.0). Vazio gera uma tag automática"
        required: false
        type: string
  push:
    branches: [main, master, feature/hybrid-cpp-redesign, feature/hybrid-nes-wasm-test]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Configurar NES WebAssembly
        run: emcmake cmake -S hub/native -B build/wasm -DCMAKE_BUILD_TYPE=Release

      - name: Compilar NES WebAssembly
        run: cmake --build build/wasm --target emuhub_core_wasm --parallel 2

      - name: Copiar runtime WebAssembly
        run: |
          mkdir -p hub/native/wasm
          cp build/wasm/emuhub-core.js build/wasm/emuhub-core.wasm hub/native/wasm/

      - name: Instalar dependências
        run: npm install

      - name: Gerar PWA
        run: python3 hub/build.py

      - name: Testes de regressão dos emuladores
        run: |
          node hub/tests/hub.test.js
          node hub/tests/gba/cpu.test.js
          node hub/tests/gba/system.test.js
          node hub/tests/snes.test.js
          node hub/tests/gb.test.js
          node hub/tests/sms.test.js
          node hub/tests/neogeo.test.js

      - name: Preparar projeto Android
        run: |
          node scripts/copiar-www.js
          npx cap add android
          node scripts/pos-android.js
          npx --yes @capacitor/assets generate --android --assetPath assets
          npx cap sync android

      - name: Restaurar chave de assinatura de debug
        if: env.ANDROID_DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore

      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Definir nome versionado do APK
        id: apk_meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          APK_NAME="EmuHub-v${VERSION}-build.${BUILD_NUMBER}-${SHORT_SHA}-debug.apk"
          mkdir -p dist/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/apk/${APK_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.release_tag }}" != "" ]]; then
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=v${VERSION}-build.${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar APK como artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: EmuHub-Android-v${{ steps.apk_meta.outputs.version }}-build.${{ github.run_number }}
          path: dist/apk/${{ steps.apk_meta.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Criar Release manual
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_meta.outputs.release_tag }}
          name: Emu Hub ${{ steps.apk_meta.outputs.release_tag }}
          body: |
            Build Android do Emu Hub.

            - Versão do app: ${{ steps.apk_meta.outputs.version }}
            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - APK: ${{ steps.apk_meta.outputs.apk_name }}

            Instale o APK no Android permitindo a instalação desta origem.
          files: dist/apk/${{ steps.apk_meta.outputs.apk_name }}
          fail_on_unmatched_files: true
          make_latest: false

      - name: Resumo do build
        run: |
          echo "## APK Android gerado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: ${{ steps.apk_meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Arquivo: ${{ steps.apk_meta.outputs.apk_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ inputs.publish_release }}" == "true" && "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "- Release: publicada" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release: não publicada (somente artefato)" >> "$GITHUB_STEP_SUMMARY"
          fi
