name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: python3 hub/build.py && rm -rf pwa && cp -r hub/dist/pwa pwa # sempre empacota a versão atual do hub
      - run: node scripts/copiar-www.js
      - run: npx cap add android
      - run: node scripts/pos-android.js
      - name: Gerar ícone Android a partir da nova marca
        run: npx --yes sharp-cli -i assets/emu-hub-icon.svg -o assets/icon.png resize 1024 1024
      - run: npx --yes @capacitor/assets generate --android --assetPath assets
      - run: npx cap sync android
      - run: mkdir -p ~/.android && cp assets/debug.keystore ~/.android/debug.keystore # mesma assinatura em todo build: dá pra atualizar sem desinstalar
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: emu-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Versão a partir do package.json
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "emu-hub-v$V.apk"
          [ -f "releases/v$V.md" ] || printf 'Emu Hub v%s\n' "$V" > "releases/v$V.md"
      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Emu Hub v${{ steps.ver.outputs.v }}
          body_path: releases/v${{ steps.ver.outputs.v }}.md
          files: emu-hub-v${{ steps.ver.outputs.v }}.apk
          make_latest: true
