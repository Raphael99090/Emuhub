name: Núcleos C++ (testes e paridade)
on:
  push:
    branches: [main, maintenance/security-build-audit, feature/hybrid-cpp-redesign]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native
        run: cmake -S hub/native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native
        run: cmake --build build/native --parallel 2
      - name: Test native contracts and NES components
        run: ctest --test-dir build/native --output-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: C++ vs JavaScript parity (GB, SNES CPU)
        run: sh hub/native/tests/parity/run.sh
