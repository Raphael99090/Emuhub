name: Native C++ and NES WebAssembly
on:
  push:
    branches: [main, maintenance/security-build-audit, feature/hybrid-cpp-redesign]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native
        run: cmake -S hub/native -B build/native -DCMAKE_BUILD_TYPE=Release
      - name: Build native
        run: cmake --build build/native --parallel 2
      - name: Test native contracts
        run: ctest --test-dir build/native --output-on-failure
  nes-wasm-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Configure WebAssembly
        run: emcmake cmake -S hub/native -B build/wasm -DCMAKE_BUILD_TYPE=Release
      - name: Build WebAssembly
        run: cmake --build build/wasm --target emuhub_core_wasm --parallel 2
      - name: Package PWA
        run: |
          mkdir -p hub/native/wasm
          cp build/wasm/emuhub-core.js build/wasm/emuhub-core.wasm hub/native/wasm/
          python3 hub/build.py
      - name: Upload PWA
        uses: actions/upload-artifact@v4
        with:
          name: emuhub-nes-wasm-pwa
          path: hub/dist/emu-hub-pwa.zip
